apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudcampus
  namespace: cloudcampus
spec:
  replicas: 1
  selector:
    matchLabels: { app: cloudcampus }
  template:
    metadata:
      labels: { app: cloudcampus }
    spec:
      containers:
        - name: web
          image: cloudcampus:local
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: cloudcampus-config }
          resources:
            requests: { cpu: 50m, memory: 48Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
